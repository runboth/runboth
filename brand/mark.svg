<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- RunBoth. Two runs start as one line and diverge at the split: the moment the
       versions stop agreeing. Red is what it used to do, green is what it does now. -->
  <rect width="100" height="100" rx="22" fill="#14151a"/>
  <g stroke-linecap="round" stroke-width="8.5" fill="none">
    <path d="M20 50 H50" stroke="#e7e8ee"/>
    <path d="M50 50 L82 31" stroke="#52bd8c"/>
    <path d="M50 50 L82 69" stroke="#f0796c"/>
  </g>
  <circle cx="50" cy="50" r="8" fill="#e7e8ee"/>
</svg>
